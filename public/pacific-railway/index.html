<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#f7f5ef"/>
  <meta name="description" content="Primer recorrido jugable de Riel, base del futuro modo ferroviario de La Ruta del Churchill."/>
  <title>Riel · La Ruta del Churchill</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23eb6b3a'/%3E%3Cpath d='M10 42Q21 10 32 31T54 19' fill='none' stroke='%23fff5de' stroke-width='6'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="./base.css"/>
  <link rel="stylesheet" href="./game.css"/>
  <link rel="stylesheet" href="./viewport.css"/>
</head>
<body>
  <div id="app-viewport" class="app-viewport">
  <section id="game-shell" class="game-shell" aria-label="Parque Riel"><div id="shell-content" class="shell-content"><div class="boot-content"><img src="./assets/branding/pacific-code-labs-reverse.png" alt="Pacific Code Labs" class="boot-brand"/><p>UN NUEVO VIAJE ESTÁ POR EMPEZAR</p><div class="boot-meter"><span id="boot-fill"></span><img id="boot-car" src="./assets/cars/car-front.svg" alt=""/></div><span id="boot-progress">Preparando el parque…</span></div></div></section>
  <section id="ride-screen" class="ride-screen" aria-label="Nivel 1" hidden><canvas id="ride-canvas" aria-label="Recorrido del nivel 1"></canvas><div class="ride-hud"><button id="ride-pause" class="game-button small" aria-label="Pausar partida">Ⅱ</button><div class="ride-hud-level"><span>NIVEL 01</span><strong>Paseo por el valle</strong></div><div class="ride-stats"><span><strong id="ride-speed">0</strong> km/h</span><span id="ride-time">00:00</span><span id="ride-stars">☆ ☆ ☆</span></div></div><div class="ride-progress"><span id="ride-progress-fill"></span></div><div class="ride-energy"><span id="ride-drive-label">ACELERADOR</span><div><span id="ride-energy-fill"></span></div></div><div class="ride-controls"><button id="ride-brake" class="ride-control">← <span>FRENAR</span></button><p>← frenar <span>·</span> → acelerar <span>·</span> P pausa</p><button id="ride-boost" class="ride-control boost"><span>ACELERAR</span> →</button></div></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <div class="landscape-hint"><span>Vista horizontal · gira el dispositivo o amplía la ventana.</span><button id="landscape-fullscreen" type="button">Pantalla completa ↗</button></div>
  <script type="module" src="./src/play.js"></script>
</body>
</html>
